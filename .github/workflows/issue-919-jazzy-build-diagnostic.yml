name: Issue 919 Jazzy build diagnostic

on:
  pull_request:
    branches:
      - jazzy

permissions:
  contents: read

jobs:
  build-diagnostic:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Jazzy dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl gnupg lsb-release build-essential
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.osrfoundation.org/gazebo.gpg \
            -o /etc/apt/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/pkgs-osrf-archive-keyring.gpg] http://packages.osrfoundation.org/gazebo/ubuntu-stable noble main" \
            > /etc/apt/sources.list.d/gazebo-stable.list
          curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /etc/apt/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" \
            > /etc/apt/sources.list.d/ros2.list
          apt-get update -qq
          apt-get install -y python3-colcon-common-extensions python3-rosdep libcli11-dev ros-jazzy-ros-base
          rosdep init
          rosdep update --rosdistro jazzy
          rosdep install --from-paths . -i -y -r --rosdistro jazzy

      - name: Build ros_gz_sim and capture log
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          source /opt/ros/jazzy/setup.bash
          mkdir -p ~/ws/src
          cp -r "$GITHUB_WORKSPACE" ~/ws/src/ros_gz
          cd ~/ws
          colcon build --packages-up-to ros_gz_sim --event-handlers console_direct+ \
            2>&1 | tee /tmp/issue-919-jazzy-build.log

      - name: Upload colcon build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-919-jazzy-build-log
          path: |
            /tmp/issue-919-jazzy-build.log
            /root/ws/log/latest_build
          if-no-files-found: warn

      - name: Preserve build result
        if: steps.build.outcome == 'failure'
        run: exit 1
