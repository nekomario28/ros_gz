name: ROS2 CI

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  ros_gz_ci:
    name: ros_gz CI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # rolling no longer releases for noble (24.04). Per rosdistro's
          # rolling/distribution.yaml, release_platforms.ubuntu = [resolute]
          # (Ubuntu 26.04 LTS).
          - docker-image: "ubuntu:resolute"
            ros-distro: "rolling"
    container:
      image: ${{ matrix.docker-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        run: .github/workflows/build-and-test.sh
        env:
          DOCKER_IMAGE: ${{ matrix.docker-image }}
          ROS_DISTRO: ${{ matrix.ros-distro }}
      - name: Report first failure to diagnostic PR
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: 3
          RUN_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib import request

          path = Path('/tmp/ros_gz-ci-diagnostic.md')
          if not path.is_file():
              raise SystemExit(0)

          repo = os.environ['GH_REPOSITORY']
          pr_number = os.environ['PR_NUMBER']
          url = f'https://api.github.com/repos/{repo}/issues/{pr_number}/comments'
          body = f"Diagnostic head: `{os.environ['RUN_HEAD']}`\n\n" + path.read_text()
          payload = json.dumps({'body': body}).encode()
          req = request.Request(
              url,
              data=payload,
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with request.urlopen(req) as response:
              print(f'diagnostic comment status: {response.status}')
          PY
